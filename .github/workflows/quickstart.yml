# Runs the quickstart on Linux, macOS and Windows. The pupil data is private, so CI has none: the
# check passes when the launcher finds R, all packages install, Quarto is found, and the script
# stops at the data check asking for the exports.
name: quickstart

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quickstart:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv  # the R version in renv.lock

      - uses: quarto-dev/quarto-actions/setup@v2

      # On Linux packages are built from source and need these system libraries
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
          libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff5-dev
          libjpeg-dev libwebp-dev

      # Keep installed packages between runs (renv's cache), so only lockfile changes reinstall
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/renv
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-

      # Answer "q" at the first prompt; the script then stops at the data check
      - name: Run the quickstart (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          RENV_PATHS_ROOT: ${{ runner.temp }}/renv
        run: echo q | ./quickstart.sh > quickstart.log 2>&1 || true

      - name: Run the quickstart (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          RENV_PATHS_ROOT: ${{ runner.temp }}/renv
        run: echo q| quickstart.bat > quickstart.log 2>&1

      - name: Check that it got to the data check
        shell: bash
        run: |
          cat quickstart.log
          grep -q "Quarto .* found" quickstart.log
          grep -q "These Het Epos exports are missing" quickstart.log
